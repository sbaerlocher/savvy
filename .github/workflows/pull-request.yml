---
name: Pull Request
run-name: |
  Pull Request by @${{ github.actor }}

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: read
  actions: read
  id-token: write

jobs:
  api-ci:
    name: Go CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-go.yml@2026-06-18
    with:
      # renovate: datasource=golang-version depName=golang
      go-version: "1.26"
      enable-postgres: true
      postgres-db: "savvy_test"
      postgres-user: "savvy"
      postgres-password: "test_password"
      test-env-vars: '{"SESSION_SECRET": "test-secret-key-for-ci", "GO_ENV": "test"}'
      enable-codecov: true
      enable-codeql: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      binary-path: "./cmd/server"
      artifact-name-prefix: "go-"
      concurrency-suffix: "go"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-ci:
    name: Client CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-js.yml@2026-06-18
    with:
      package-manager: "npm"
      working-directory: "./client"
      enable-typecheck: true
      enable-format-check: true
      enable-lint: true
      enable-build: true
      enable-tests: true
      enable-coverage: true
      enable-codecov: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      test-command: "test"
      coverage-files: "./client/coverage/lcov.info"
      artifact-name-prefix: "client-"
      concurrency-suffix: "client"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  helm-test:
    name: Helm Chart Test
    uses: sbaerlocher/.github/.github/workflows/ci-gitops.yml@2026-06-18
    with:
      fleet-paths: "deploy"
      enable-yaml-lint: false
      enable-fleet-validation: false
      enable-gitrepo-validation: false
      enable-helm-lint: true
      enable-k8s-validation: false
      enable-docs-check: false
      concurrency-suffix: "helm"

  e2e:
    name: E2E Tests
    uses: sbaerlocher/.github/.github/workflows/e2e-dde.yml@2026-06-10
    permissions:
      contents: read
      pull-requests: write
    with:
      # Pinned beta: alpha.5 built a dev-layer over distroless images and
      # crashed; the beta line skips shell-less bases and renamed plugin
      # invocation from `project:exec:<name>` to `project:<name>`.
      dde-version: v2.0.0-beta.2
      compose-profiles: e2e
      playwright-directory: ./client
      playwright-browsers: chromium
      pre-test-commands: |
        dde project:e2e:reset-db
        dde project:e2e:wait -- --timeout 90
      test-command-override: dde project:e2e:test
      failure-logs-command: |
        dde project:e2e:logs -- 200
      teardown-command: dde project:e2e:down

  code-review:
    name: Claude Code Review
    uses: sbaerlocher/.github/.github/workflows/ai-claude-review.yml@2026-06-18
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
