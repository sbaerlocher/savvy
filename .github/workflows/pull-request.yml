---
name: Pull Request
run-name: |
  Pull Request by @${{ github.actor }}

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: read
  actions: read
  id-token: write

jobs:
  api-ci:
    name: Go CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-go.yml@2026-08-13
    with:
      # renovate: datasource=golang-version depName=golang
      go-version: "1.26.6"
      enable-postgres: true
      postgres-db: "savvy_test"
      postgres-user: "savvy"
      postgres-password: "test_password"
      test-env-vars: '{"SESSION_SECRET": "test-secret-key-for-ci", "GO_ENV": "test"}'
      enable-codecov: true
      enable-codeql: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      binary-path: "./cmd/server"
      artifact-name-prefix: "go-"
      concurrency-suffix: "go"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-ci:
    name: Client CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-js.yml@2026-08-13
    with:
      package-manager: "npm"
      working-directory: "./client"
      enable-typecheck: true
      enable-format-check: true
      enable-lint: true
      enable-build: true
      enable-tests: true
      enable-coverage: true
      enable-codecov: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      test-command: "test"
      coverage-files: "./client/coverage/lcov.info"
      artifact-name-prefix: "client-"
      concurrency-suffix: "client"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  helm-test:
    name: Helm Chart Test
    uses: sbaerlocher/.github/.github/workflows/ci-gitops.yml@2026-08-13
    with:
      fleet-paths: "deploy"
      enable-yaml-lint: false
      enable-fleet-validation: false
      enable-gitrepo-validation: false
      enable-helm-lint: true
      enable-k8s-validation: false
      enable-docs-check: false
      concurrency-suffix: "helm"

  e2e:
    name: E2E Tests
    uses: sbaerlocher/.github/.github/workflows/e2e-dde.yml@2026-08-13
    with:
      # Pinned to the v2.0.0 stable line: releases up to and including
      # v2.0.0-beta.2 abort a plugin call after 300 seconds, which is barely
      # above this suite's runtime and kills the mobile/firefox jobs outright.
      # v2.0.0-rc.1 removed that cap. Renovate does not track this pin, so bump
      # it by hand.
      dde-version: v2.0.0
      compose-profiles: e2e
      playwright-directory: ./client
      playwright-browsers: chromium
      pre-test-commands: |
        dde project:e2e:reset-db
        dde project:e2e:wait -- --timeout 90
      test-command-override: dde project:e2e:test
      failure-logs-command: |
        dde project:e2e:logs -- 200
      teardown-command: dde project:e2e:down

  # Non-blocking on purpose: the "Mobile Chrome" project has never run in any
  # gate, so its spec suite is expected to start out red. This job is reporting
  # only — it is deliberately NOT listed in the `main-branch-protection`
  # ruleset's required status checks, so a failure here surfaces the count
  # without blocking merges while it is driven down. Note that
  # `continue-on-error` cannot be used for this: GitHub rejects it on a job that
  # calls a reusable workflow, which invalidates the whole file. Promoting this
  # to a real gate therefore means adding it to the ruleset, and that switch is
  # tracked as its own intake card, because a comment alone reminds nobody.
  # `playwright-browsers: chromium` is deliberate: "Mobile Chrome" is the
  # `devices['Pixel 5']` descriptor (client/playwright.config.ts), which runs on
  # the chromium binary rather than a browser of its own.
  e2e-mobile:
    name: E2E Tests (Mobile Chrome)
    uses: sbaerlocher/.github/.github/workflows/e2e-dde.yml@2026-08-10
    with:
      dde-version: v2.0.0
      compose-profiles: e2e
      playwright-directory: ./client
      playwright-browsers: chromium
      pre-test-commands: |
        dde project:e2e:reset-db
        dde project:e2e:wait -- --timeout 90
      test-command-override: dde project:e2e:test -- --project="Mobile Chrome"
      failure-logs-command: |
        dde project:e2e:logs -- 200
      teardown-command: dde project:e2e:down
      concurrency-suffix: "mobile"

  # Non-blocking for the same reason as `e2e-mobile`: the firefox project is
  # defined in client/playwright.config.ts but has never been gated, and this
  # job is kept out of the ruleset's required status checks. Promote it by
  # adding it there once it passes; tracked as its own intake card.
  e2e-firefox:
    name: E2E Tests (Firefox)
    uses: sbaerlocher/.github/.github/workflows/e2e-dde.yml@2026-08-10
    with:
      dde-version: v2.0.0
      compose-profiles: e2e
      playwright-directory: ./client
      playwright-browsers: firefox
      pre-test-commands: |
        dde project:e2e:reset-db
        dde project:e2e:wait -- --timeout 90
      test-command-override: dde project:e2e:test -- --project=firefox
      failure-logs-command: |
        dde project:e2e:logs -- 200
      teardown-command: dde project:e2e:down
      concurrency-suffix: "firefox"

  code-review:
    name: Claude Code Review
    uses: sbaerlocher/.github/.github/workflows/ai-claude-review.yml@2026-08-13
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
