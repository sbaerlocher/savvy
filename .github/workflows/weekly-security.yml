---
name: Weekly Security Scan
run-name: |
  Security Scan by @${{ github.actor }}

"on":
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
  packages: read

jobs:
  code-analysis:
    name: SAST (CodeQL)
    uses: sbaerlocher/.github/.github/workflows/security-code.yml@2026-09-02
    with:
      languages: '["go", "javascript"]'
      # renovate: datasource=golang-version depName=golang
      go-version: "1.27.1"
      concurrency-suffix: code

  dependency-scan:
    name: Dependencies & Licenses
    uses: sbaerlocher/.github/.github/workflows/security-deps.yml@2026-09-02
    with:
      language: "go"
      enable-license-check: true
      concurrency-suffix: deps

  secret-detection:
    name: Secret Detection
    uses: sbaerlocher/.github/.github/workflows/security-secrets.yml@2026-09-02
    with:
      concurrency-suffix: secrets

  container-scan:
    name: Container Security
    uses: sbaerlocher/.github/.github/workflows/security-containers.yml@2026-09-02
    with:
      # Must match the image pushed by the release workflow
      image-ref: "ghcr.io/sbaerlocher/container/savvy:latest"
      concurrency-suffix: containers
