---
name: Merge to Main
run-name: |
  Merge to Main by @${{ github.actor }}

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write

jobs:
  api-ci:
    name: Go CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-go.yml@2026-07-29
    with:
      # renovate: datasource=golang-version depName=golang
      go-version: "1.26.5"
      enable-postgres: true
      postgres-db: "savvy_test"
      postgres-user: "savvy"
      postgres-password: "test_password"
      test-env-vars: '{"SESSION_SECRET": "test-secret-key-for-ci", "GO_ENV": "test"}'
      enable-codecov: true
      enable-codeql: true
      enable-security-scans: true
      # No PR context post-merge; dependency-review skips itself on push.
      enable-dependency-review: false
      enable-sarif-upload: false
      binary-path: "./cmd/server"
      artifact-name-prefix: "go-"
      concurrency-suffix: "merge-go"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-ci:
    name: Client CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-js.yml@2026-07-29
    with:
      package-manager: "npm"
      working-directory: "./client"
      enable-typecheck: true
      enable-format-check: true
      enable-lint: true
      enable-build: true
      enable-tests: true
      enable-coverage: true
      enable-codecov: true
      enable-security-scans: true
      # No PR context post-merge; dependency-review skips itself on push.
      enable-dependency-review: false
      enable-sarif-upload: false
      test-command: "test"
      coverage-files: "./client/coverage/lcov.info"
      artifact-name-prefix: "client-"
      concurrency-suffix: "merge-client"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  helm-test:
    name: Helm Chart Test
    uses: sbaerlocher/.github/.github/workflows/ci-gitops.yml@2026-07-29
    with:
      fleet-paths: "deploy"
      enable-yaml-lint: false
      enable-fleet-validation: false
      enable-gitrepo-validation: false
      enable-helm-lint: true
      enable-k8s-validation: false
      enable-docs-check: false
      concurrency-suffix: "merge-helm"
