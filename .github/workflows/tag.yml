---
name: Software Release
run-name: |
  Release ${{ github.ref_name }} by @${{ github.actor }}

"on":
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  go-release:
    name: Go Binaries (Linux only)
    uses: sbaerlocher/.github/.github/workflows/release-go.yml@2026-08-31
    with:
      # renovate: datasource=golang-version depName=golang
      go-version: "1.27.0"

  docker-release:
    name: Docker Multi-Platform
    needs: go-release
    uses: sbaerlocher/.github/.github/workflows/release-docker.yml@2026-08-31
    with:
      image-name: "sbaerlocher/container/savvy"
      dockerfile: "Dockerfile"
      platforms: "linux/amd64,linux/arm64"
      registry: "ghcr.io"
      push: true
      build-args: |
        VERSION=${{ github.ref_name }}
      docker-metadata-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest,enable={{is_default_branch}}

  helm-release:
    name: Helm Chart
    needs: docker-release
    uses: sbaerlocher/.github/.github/workflows/release-helm.yml@2026-08-31
    with:
      chart-path: "deploy/helm"
      chart-name: "savvy"
      registry: "ghcr.io"
      registry-path: "${{ github.repository_owner }}/chart"
      version: "${{ github.ref_name }}"
      image-digest: "${{ needs.docker-release.outputs.image-digest }}"
    secrets:
      registry-token: "${{ secrets.GITHUB_TOKEN }}"
