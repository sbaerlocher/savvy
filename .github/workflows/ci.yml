---
name: Continuous Integration

"on":
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  api-ci:
    name: Go CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-go.yml@2026-02-14
    with:
      # renovate: datasource=golang-version depName=golang
      go-version: "1.26"
      enable-postgres: true
      postgres-db: "savvy_test"
      postgres-user: "savvy"
      postgres-password: "test_password"
      test-env-vars: '{"SESSION_SECRET": "test-secret-key-for-ci", "GO_ENV": "test"}'
      enable-codecov: true
      enable-codeql: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      binary-path: "./cmd/server"
      artifact-name-prefix: "go-"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-ci:
    name: Client CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-js.yml@2026-02-14
    with:
      package-manager: "npm"
      working-directory: "./client"
      enable-type-check: true
      enable-format-check: true
      enable-lint: false
      enable-build: true
      enable-tests: true
      enable-coverage: true
      enable-codecov: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      test-command: "test"
      coverage-files: "./client/coverage/lcov.info"
      artifact-name-prefix: "client-"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  helm-test:
    name: Helm Chart Test
    uses: sbaerlocher/.github/.github/workflows/helm-test.yml@2026-02-14
    with:
      chart-path: "deploy/helm"
      enable-kind-tests: true
