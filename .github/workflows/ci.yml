---
name: Continuous Integration

"on":
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  api-ci:
    name: Go CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-go.yml@2026-06-18
    with:
      # renovate: datasource=golang-version depName=golang
      go-version: "1.26"
      enable-postgres: true
      postgres-db: "savvy_test"
      postgres-user: "savvy"
      postgres-password: "test_password"
      test-env-vars: '{"SESSION_SECRET": "test-secret-key-for-ci", "GO_ENV": "test"}'
      enable-codecov: true
      enable-codeql: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      binary-path: "./cmd/server"
      artifact-name-prefix: "go-"
      # All three reusables derive their concurrency group from
      # `${{ github.workflow }}-${{ github.ref }}`, which is identical for
      # every call made from this single workflow. Without a distinct suffix
      # they share one group with cancel-in-progress and cancel each other
      # (jobs show up as "fail 0s"). Give each call its own suffix.
      concurrency-suffix: "go"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-ci:
    name: Client CI Pipeline
    uses: sbaerlocher/.github/.github/workflows/ci-js.yml@2026-06-18
    with:
      package-manager: "npm"
      working-directory: "./client"
      enable-typecheck: true
      enable-format-check: true
      enable-lint: false
      enable-build: true
      enable-tests: true
      enable-coverage: true
      enable-codecov: true
      enable-security-scans: true
      enable-dependency-review: true
      enable-sarif-upload: false
      test-command: "test"
      coverage-files: "./client/coverage/lcov.info"
      artifact-name-prefix: "client-"
      concurrency-suffix: "client"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  helm-test:
    name: Helm Chart Test
    uses: sbaerlocher/.github/.github/workflows/ci-gitops.yml@2026-06-18
    with:
      fleet-paths: "deploy"
      enable-yaml-lint: false
      enable-fleet-validation: false
      enable-gitrepo-validation: false
      enable-helm-lint: true
      enable-k8s-validation: false
      enable-docs-check: false
      concurrency-suffix: "helm"
