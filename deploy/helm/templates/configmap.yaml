apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "savvy.fullname" . }}-config
  labels:
    {{- include "savvy.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  ENVIRONMENT: {{ .Values.config.environment }}
  LOG_LEVEL: {{ .Values.config.logLevel }}
  AUTO_MIGRATE: {{ .Values.config.autoMigrate | quote }}
  ENABLE_CARDS: {{ .Values.config.enableCards | quote }}
  ENABLE_VOUCHERS: {{ .Values.config.enableVouchers | quote }}
  ENABLE_GIFT_CARDS: {{ .Values.config.enableGiftCards | quote }}
  ENABLE_LOCAL_LOGIN: {{ .Values.config.enableLocalLogin | quote }}
  ENABLE_REGISTRATION: {{ .Values.config.enableRegistration | quote }}
  TIMEZONE: {{ .Values.config.timezone | default "UTC" | quote }}
  {{- if .Values.config.smtpHost }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_FROM_EMAIL: {{ .Values.config.smtpFromEmail | quote }}
  SMTP_FROM_NAME: {{ .Values.config.smtpFromName | quote }}
  SMTP_USE_TLS: {{ .Values.config.smtpUseTLS | quote }}
  {{- end }}
  {{- if .Values.config.vapidPublicKey }}
  VAPID_PUBLIC_KEY: {{ .Values.config.vapidPublicKey | quote }}
  VAPID_SUBJECT: {{ .Values.config.vapidSubject | quote }}
  {{- end }}
  ENABLE_EXPIRY_REMINDERS: {{ .Values.config.enableExpiryReminders | quote }}
  REMINDER_DAYS_BEFORE: {{ .Values.config.reminderDaysBefore | quote }}
  REMINDER_CHECK_TIME: {{ .Values.config.reminderCheckTime | default "08:00" | quote }}
  ENABLE_2FA: {{ .Values.config.enable2FA | quote }}
  TOTP_ISSUER: {{ .Values.config.totpIssuer | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  {{- if .Values.config.otelEnabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint }}
  {{- end }}
  {{- if .Values.oauth.enabled }}
  OAUTH_ISSUER: {{ required "oauth.issuer is required when OAuth is enabled!" .Values.oauth.issuer }}
  OAUTH_REDIRECT_URL: {{ required "oauth.redirectUrl is required when OAuth is enabled!" .Values.oauth.redirectUrl }}
  OAUTH_SUCCESS_URL: {{ .Values.oauth.successUrl | default "/" }}
  OAUTH_ADMIN_GROUP: {{ .Values.oauth.adminGroup | default "Savvy Admins" }}
  {{- end }}
