---
apiVersion: v1
kind: ConfigMap
metadata:
  name: savvy
data:
  ENVIRONMENT: "development"
  DATABASE_URL: "postgres://savvy:devpassword@dev-postgres:5432/savvy_dev?sslmode=disable"
  ENABLE_LOCAL_LOGIN: "true"
  ENABLE_REGISTRATION: "true"
  TIMEZONE: "Europe/Zurich"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "dev@localhost"
  SMTP_FROM_NAME: "Savvy Dev"
  SMTP_USE_TLS: "false"
  VAPID_PUBLIC_KEY: ""
  VAPID_SUBJECT: "mailto:dev@localhost"
  ENABLE_EXPIRY_REMINDERS: "false"
  REMINDER_DAYS_BEFORE: "7"
  REMINDER_CHECK_TIME: "08:00"
  ENABLE_2FA: "false"
  TOTP_ISSUER: "Savvy Dev"
  OTEL_ENABLED: "false"
