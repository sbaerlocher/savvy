services:
    api:
        profiles:
            - dev
            - ''
        build:
            context: .
            dockerfile: Dockerfile
            target: backend-dev
        environment:
            VERSION: '${VERSION:-dev}'
            DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/savvy?sslmode=disable'
            PORT: 8080
            SESSION_SECRET: '${SESSION_SECRET:-dev-secret-change-in-production-not-for-use}'
            GO_ENV: development
            CORS_ALLOWED_ORIGINS: 'https://savvy.test'
            OTEL_ENABLED: '${OTEL_ENABLED:-true}'
            OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}'
            OTEL_SERVICE_NAME: '${OTEL_SERVICE_NAME:-savvy-api}'
            OTEL_SERVICE_VERSION: '${OTEL_SERVICE_VERSION:-1.8.0}'
            OAUTH_CLIENT_ID: '${OAUTH_CLIENT_ID:-}'
            OAUTH_CLIENT_SECRET: '${OAUTH_CLIENT_SECRET:-}'
            OAUTH_ISSUER: '${OAUTH_ISSUER:-}'
            OAUTH_REDIRECT_URL: '${OAUTH_REDIRECT_URL:-https://savvy.test/auth/oauth/callback}'
            OAUTH_ADMIN_EMAILS: '${OAUTH_ADMIN_EMAILS:-}'
            OAUTH_ADMIN_GROUP: '${OAUTH_ADMIN_GROUP:-}'
            FRONTEND_URL: '${FRONTEND_URL:-https://savvy.test}'
            TIMEZONE: '${TIMEZONE:-Europe/Zurich}'
            ENABLE_CARDS: '${ENABLE_CARDS:-true}'
            ENABLE_VOUCHERS: '${ENABLE_VOUCHERS:-true}'
            ENABLE_GIFT_CARDS: '${ENABLE_GIFT_CARDS:-true}'
            ENABLE_LOCAL_LOGIN: '${ENABLE_LOCAL_LOGIN:-true}'
            ENABLE_REGISTRATION: '${ENABLE_REGISTRATION:-true}'
            SMTP_HOST: mail
            SMTP_PORT: 1025
            SMTP_USERNAME: ''
            SMTP_PASSWORD: ''
            SMTP_FROM_EMAIL: noreply@savvy.test
            SMTP_FROM_NAME: Savvy
            SMTP_USE_TLS: 'false'
        restart: unless-stopped
        volumes:
            - '.:/app:delegated'
            - /app/tmp
        healthcheck:
            test:
                - CMD
                - curl
                - '-f'
                - 'http://localhost:8080/health'
            interval: 15s
            timeout: 3s
            start_period: 10s
            retries: 3
        security_opt:
            - 'no-new-privileges:true'
        networks:
            default:
            services:
    client:
        profiles:
            - dev
            - ''
        build:
            context: .
            dockerfile: Dockerfile
            target: frontend-dev
        environment:
            VITE_API_BASE_URL: 'https://savvy.test'
            VITE_OTEL_ENABLED: '${VITE_OTEL_ENABLED:-false}'
        restart: unless-stopped
        volumes:
            - './client:/app/client:delegated'
            - /app/client/node_modules
        develop:
            watch:
                -
                    action: rebuild
                    path: ./client/package-lock.json
                -
                    action: sync
                    path: ./client
                    target: /app/client
                    ignore:
                        - node_modules/
        depends_on:
            - api
        networks:
            default:
            services:
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--tries=1'
                - '--spider'
                - 'http://localhost:5173'
            interval: 15s
            timeout: 3s
            start_period: 10s
            retries: 3
        security_opt:
            - 'no-new-privileges:true'
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.savvy-test-client.rule=Host(`savvy.test`)'
            - 'traefik.http.routers.savvy-test-client.tls=true'
            - 'traefik.http.services.savvy-test-client.loadbalancer.server.port=5173'
    app-e2e:
        profiles:
            - e2e
        container_name: savvy-app-e2e
        build:
            context: .
            dockerfile: Dockerfile
            target: production-build
            args:
                VERSION: e2e-test
        environment:
            VERSION: e2e-test
            # Reuses the dde stock postgres (declared in .dde/config.yml)
            # on its own database so dev and e2e do not share state.
            # Run `dde project:e2e:reset-db` before bringing this
            # service up to drop+recreate `savvy_e2e`.
            DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/savvy_e2e?sslmode=disable'
            SERVER_PORT: 8080
            SESSION_SECRET: test-secret-key-for-e2e-minimum-32-characters
            GO_ENV: production
            AUTO_MIGRATE: 'true'
            CORS_ALLOWED_ORIGINS: 'https://e2e.savvy.test'
            FRONTEND_URL: 'https://e2e.savvy.test'
            ENABLE_CARDS: 'true'
            ENABLE_VOUCHERS: 'true'
            ENABLE_GIFT_CARDS: 'true'
            ENABLE_LOCAL_LOGIN: 'true'
            ENABLE_REGISTRATION: 'true'
            RATE_LIMIT_GLOBAL_RATE: '10000'
            RATE_LIMIT_GLOBAL_BURST: '1000'
            RATE_LIMIT_AUTH_RATE: '1000'
            RATE_LIMIT_AUTH_BURST: '100'
            RATE_LIMIT_PASSWORD_RESET_RATE: '1000'
            RATE_LIMIT_PASSWORD_RESET_BURST: '100'
            RATE_LIMIT_USER_RATE: '10000'
            RATE_LIMIT_USER_BURST: '1000'
            OTEL_ENABLED: 'false'
        restart: on-failure
        entrypoint:
            - /app/e2e
        # No host port published: tests reach the app through the dde
        # traefik on https://e2e.savvy.test (resolved via dde dnsmasq).
        healthcheck:
            test:
                - CMD
                - /app/savvy
                - '-health'
                - '-port'
                - '8080'
            interval: 5s
            timeout: 3s
            start_period: 30s
            retries: 10
        security_opt:
            - 'no-new-privileges:true'
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.e2e-savvy-test-app-e2e.rule=Host(`e2e.savvy.test`)'
            - 'traefik.http.routers.e2e-savvy-test-app-e2e.tls=true'
            - 'traefik.http.services.e2e-savvy-test-app-e2e.loadbalancer.server.port=8080'
        networks:
            default:
            services:
    otel-collector:
        profiles:
            - observability
        image: 'otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108'
        restart: unless-stopped
        command:
            - '--config=/etc/otel-collector-config.yaml'
        volumes:
            - './deploy/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro'
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.otel-savvy-test-otel-collector.rule=Host(`otel.savvy.test`)'
            - 'traefik.http.routers.otel-savvy-test-otel-collector.tls=true'
            - 'traefik.http.services.otel-savvy-test-otel-collector.loadbalancer.server.port=4318'
    loki:
        profiles:
            - observability
        image: 'grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8'
        restart: unless-stopped
        command: '-config.file=/etc/loki/loki-config.yaml'
        volumes:
            - './deploy/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro'
            - 'loki_data:/loki'
        healthcheck:
            test:
                - CMD
                - wget
                - '--spider'
                - '-q'
                - 'http://localhost:3100/ready'
            interval: 10s
            timeout: 5s
            retries: 3
    promtail:
        profiles:
            - observability
        image: 'grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9'
        restart: unless-stopped
        command: '-config.file=/etc/promtail/promtail-config.yaml'
        volumes:
            - './deploy/observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro'
            - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
            - '/var/run/docker.sock:/var/run/docker.sock:ro'
        depends_on:
            - loki
    tempo:
        profiles:
            - observability
        image: 'grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3'
        restart: unless-stopped
        command: '-config.file=/etc/tempo/tempo-config.yaml'
        volumes:
            - './deploy/observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro'
            - 'tempo_data:/var/tempo'
        healthcheck:
            test:
                - CMD
                - wget
                - '--spider'
                - '-q'
                - 'http://localhost:3200/ready'
            interval: 10s
            timeout: 5s
            retries: 3
    prometheus:
        profiles:
            - observability
        image: 'prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893'
        restart: unless-stopped
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--enable-feature=exemplar-storage'
            - '--enable-feature=native-histograms'
        volumes:
            - './deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - 'prometheus_data:/prometheus'
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.prometheus-savvy-test-prometheus.rule=Host(`prometheus.savvy.test`)'
            - 'traefik.http.routers.prometheus-savvy-test-prometheus.tls=true'
            - 'traefik.http.services.prometheus-savvy-test-prometheus.loadbalancer.server.port=9090'
        healthcheck:
            test:
                - CMD
                - wget
                - '--spider'
                - '-q'
                - 'http://localhost:9090/-/healthy'
            interval: 10s
            timeout: 5s
            retries: 3
    grafana:
        profiles:
            - observability
        image: 'grafana/grafana:13.0@sha256:ed2dca5b8b819ecb34ffa73b6cb218931ae4817512f649dd819516822e5996a7'
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_INSTALL_PLUGINS=grafana-piechart-panel
        restart: unless-stopped
        volumes:
            - './deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro'
            - './deploy/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro'
            - './deploy/observability/dashboards:/var/lib/grafana/dashboards:ro'
            - './deploy/grafana:/var/grafana:ro'
            - 'grafana_data:/var/lib/grafana'
        depends_on:
            - loki
            - tempo
            - prometheus
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.grafana-savvy-test-grafana.rule=Host(`grafana.savvy.test`)'
            - 'traefik.http.routers.grafana-savvy-test-grafana.tls=true'
            - 'traefik.http.services.grafana-savvy-test-grafana.loadbalancer.server.port=3000'
        healthcheck:
            test:
                - CMD
                - wget
                - '--spider'
                - '-q'
                - 'http://localhost:3000/api/health'
            interval: 10s
            timeout: 5s
            retries: 3
volumes:
    loki_data: null
    tempo_data: null
    prometheus_data: null
    grafana_data: null
networks:
    default:
        name: dde
        external: true
    services:
        name: dde-services-savvy
        external: true
