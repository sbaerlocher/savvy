---
# ==============================================================================
# Savvy Docker Compose - Development
# ==============================================================================
# Development Mode:
#   docker compose up
#   → Frontend (Vite Dev Server) on http://localhost:5173
#   → Backend (Go API) on http://localhost:8080
# ==============================================================================

services:
  # ============================================================================
  # PostgreSQL Database (runs in dev and e2e modes)
  # ============================================================================
  postgres:
    profiles: ["", "e2e"] # Runs by default AND with --profile e2e
    image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    container_name: savvy-postgres
    environment:
      POSTGRES_DB: savvy
      POSTGRES_USER: savvy
      POSTGRES_PASSWORD: savvy_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savvy"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - savvy-network

  # ============================================================================
  # DEV MODE: Go API Server (with Air Hot Reload)
  # ============================================================================
  api:
    profiles: ["dev", ""] # Runs by default (no --profile needed)
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    container_name: savvy-api
    restart: unless-stopped

    environment:
      VERSION: ${VERSION:-dev}
      DATABASE_URL: postgres://savvy:savvy_dev_password@postgres:5432/savvy?sslmode=disable
      PORT: 8080
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production-not-for-use}
      GO_ENV: development

      # CORS for Frontend Dev Server
      CORS_ALLOWED_ORIGINS: http://localhost:5173

      # Observability (OpenTelemetry)
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-savvy-api}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.8.0}

      # OAuth
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:8080/auth/oauth/callback}
      OAUTH_ADMIN_EMAILS: ${OAUTH_ADMIN_EMAILS:-}
      OAUTH_ADMIN_GROUP: ${OAUTH_ADMIN_GROUP:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      # Timezone for date calculations (voucher status, etc.)
      TIMEZONE: ${TIMEZONE:-Europe/Zurich}

      # Feature Toggles
      ENABLE_CARDS: ${ENABLE_CARDS:-true}
      ENABLE_VOUCHERS: ${ENABLE_VOUCHERS:-true}
      ENABLE_GIFT_CARDS: ${ENABLE_GIFT_CARDS:-true}
      ENABLE_LOCAL_LOGIN: ${ENABLE_LOCAL_LOGIN:-true}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-true}

      # SMTP (Mailpit dev mail catcher)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: noreply@savvy.local
      SMTP_FROM_NAME: Savvy
      SMTP_USE_TLS: "false"

    ports:
      - "127.0.0.1:8080:8080" # Map host:8080 to container:8080

    volumes:
      - .:/app:delegated
      - /app/tmp
      # Removed /app/vendor - use -mod=mod to download dependencies

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] # Backend runs on port 8080
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true

    networks:
      - savvy-network

  # ============================================================================
  # E2E MODE: Production API Server (with embedded frontend)
  # ============================================================================
  app-e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production-build
      args:
        VERSION: e2e-test
    container_name: savvy-app-e2e
    restart: on-failure

    # Override entrypoint to use E2E wrapper (runs seed then server)
    entrypoint: ["/app/e2e"]

    environment:
      VERSION: e2e-test
      DATABASE_URL: postgres://savvy:savvy_dev_password@postgres:5432/savvy?sslmode=disable
      SERVER_PORT: 8080
      SESSION_SECRET: test-secret-key-for-e2e-minimum-32-characters
      GO_ENV: production
      AUTO_MIGRATE: "true"

      # Feature Toggles (all enabled for E2E)
      ENABLE_CARDS: "true"
      ENABLE_VOUCHERS: "true"
      ENABLE_GIFT_CARDS: "true"
      ENABLE_LOCAL_LOGIN: "true"
      ENABLE_REGISTRATION: "true"

      # Rate Limiting (very high limits for E2E to prevent test failures)
      RATE_LIMIT_GLOBAL_RATE: "10000"
      RATE_LIMIT_GLOBAL_BURST: "1000"
      RATE_LIMIT_AUTH_RATE: "1000"
      RATE_LIMIT_AUTH_BURST: "100"
      RATE_LIMIT_PASSWORD_RESET_RATE: "1000"
      RATE_LIMIT_PASSWORD_RESET_BURST: "100"
      RATE_LIMIT_USER_RATE: "10000"
      RATE_LIMIT_USER_BURST: "1000"

      # Disable observability for E2E
      OTEL_ENABLED: "false"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/app/savvy", "-health", "-port", "8080"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

    security_opt:
      - no-new-privileges:true

    networks:
      - savvy-network

  # ============================================================================
  # DEV MODE: SvelteKit Client (Vite Dev Server with HMR)
  # ============================================================================
  client:
    profiles: ["dev", ""] # Runs by default (no --profile needed)
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    container_name: savvy-client
    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_OTEL_ENABLED: ${VITE_OTEL_ENABLED:-false}

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./client:/app/client:delegated
      - /app/client/node_modules

    develop:
      watch:
        - action: rebuild
          path: ./client/package-lock.json
        - action: sync
          path: ./client
          target: /app/client
          ignore:
            - node_modules/

    depends_on:
      - api

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true

    networks:
      - savvy-network

  # ============================================================================
  # DEV MODE: Mailpit (Mail Catcher)
  # ============================================================================
  mailpit:
    profiles: ["dev", ""]
    image: axllent/mailpit:latest@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    container_name: savvy-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Web UI
    security_opt:
      - no-new-privileges:true
    networks:
      - savvy-network

  # ============================================================================
  # OBSERVABILITY STACK (optional, use --profile observability)
  # ============================================================================

  # OpenTelemetry Collector - receives OTLP from apps, exports to backends
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.150.1@sha256:a516c26968aa1feb5e5fc0562e3338ea13755cb4f373603226bcc4e276374ad0
    container_name: savvy-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8888:8888" # OTEL Collector internal metrics
      - "127.0.0.1:8889:8889" # Prometheus exporter (app metrics)
    networks:
      - savvy-network
      # Note: No healthcheck - otel-collector image doesn't include wget/curl
      # Service will restart automatically if it crashes

  # Grafana Loki - log aggregation
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.1@sha256:73e905b51a7f917f7a1075e4be68759df30226e03dcb3cd2213b989cc0dc8eb4
    container_name: savvy-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - savvy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Promtail - log collector for Docker containers
  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.6.10@sha256:2a0f5e3e160ee5d549c585f6cc4f4e1c566ff783324a424bd75bc16503fc660e
    container_name: savvy-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./deploy/observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - savvy-network
    depends_on:
      - loki

  # Grafana Tempo - distributed tracing
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.4@sha256:a6616c9d224770c883a67b50e4941e99c5df81b076ef05f516bb7cce5a96cec0
    container_name: savvy-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./deploy/observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # Tempo HTTP
    networks:
      - savvy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus - metrics storage
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.11.2@sha256:5550dc63da361dc30f6fe02ac0e4dfc736ededfef3c8d12a634db04a67824d78
    container_name: savvy-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--enable-feature=exemplar-storage"
      - "--enable-feature=native-histograms"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - savvy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grafana - visualization and dashboards
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.0@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: savvy-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./deploy/observability/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/grafana:/var/grafana:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - savvy-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  savvy-network:
    driver: bridge
